[server]
headless = true
enableXsrfProtection = false
enableCORS = false
enableWebsocketCompression = false

[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#1E293B"
font = "sans serif"

[browser]
gatherUsageStats = false

[logger]
level = "warning"
