[server]
port = 8502
headless = true
address = "127.0.0.1"
enableXsrfProtection = false
enableCORS = false
enableWebsocketCompression = false

[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#1E293B"
font = "sans serif"

[browser]
gatherUsageStats = false
serverAddress = "corrector.timshelstudio.cl"
serverPort = 443

[logger]
level = "warning"
